<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>BACAP Tracker</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<script src="/js/theme.js"></script>
</head>
<body>
<a class="skip" href="#view">Zum Inhalt</a>
<header class="topbar">
  <div class="topbar-in">
    <a class="logo" href="/" data-link>
      <span class="logo-mark" aria-hidden="true"></span>
      <span class="logo-text" id="siteTitle">BACAP Tracker</span>
    </a>
    <nav class="mainnav" aria-label="Hauptmenü">
      <a href="/" data-link data-nav="start">Start</a>
      <a href="/alle" data-link data-nav="alle">Advancements</a>
      <a href="/neu" data-link data-nav="neu">Neu &amp; geändert</a>
      <a href="/vergleich" data-link data-nav="vergleich">Vergleich</a>
    </nav>
    <div class="topbar-tools">
      <label class="switch" title="Versteckte Advancements auch zeigen, wenn der Spieler sie noch nicht hat">
        <input type="checkbox" id="spoiler"><span class="switch-box" aria-hidden="true"></span><span class="switch-label">Spoiler</span>
      </label>
      <button type="button" class="mc-btn small icon-btn" id="themeBtn" aria-label="Hell oder dunkel umschalten" title="Hell / dunkel"></button>
      <span class="live" id="live" title="Live-Verbindung zum Server" hidden><i></i><span>Live</span></span>
    </div>
  </div>
</header>

<main id="view" class="page" tabindex="-1">
  <div class="mc-panel loading-panel"><span class="spinner" aria-hidden="true"></span> Lade Daten vom Server …</div>
</main>

<footer class="foot" id="foot"></footer>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="mc-tooltip" id="tooltip" role="tooltip" hidden></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
